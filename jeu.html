<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aux confins d'Athanor</title>
<style>
:root{
  --bg:#0c0d10; --panel:#15171c; --panel2:#1c1f26; --border:#33384a;
  --red:#e05a4e; --orange:#e0954e; --yellow:#e0c94e; --yellowpale:#d9d39a;
  --green:#5fbf6b; --green2:#7fd88a; --blue:#5aa9e0; --purple:#b087e0;
  --pink:#e08fc0; --cyan:#5fd0d0; --gray:#9aa0ac; --darkgray:#5a5f6b;
  --white:#eceff4; --brown:#a3703f; --brownlight:#c99a63;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--white);
  font-family:'Courier New',ui-monospace,monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
body{display:flex;flex-direction:column;min-height:100%;}
#statbar{background:var(--panel2);border-bottom:2px solid var(--border);
  padding:8px 12px;display:flex;flex-wrap:wrap;gap:14px;font-size:13px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;}
#statbar div{white-space:nowrap;}
.lbl{color:var(--gray);}
.bar-wrap{display:inline-block;width:90px;height:9px;background:#000;border:1px solid var(--border);vertical-align:middle;margin-left:4px;}
.bar-fill{height:100%;}
#title{text-align:center;padding:10px 0 4px;color:var(--red);letter-spacing:2px;font-size:18px;border-bottom:1px dashed var(--border);}
#main{flex:1;max-width:820px;margin:0 auto;width:100%;padding:14px 16px 30px;}
#ascii{white-space:pre;text-align:center;color:var(--green);font-size:11px;line-height:1.1;margin-bottom:6px;}
#log{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:14px;min-height:60px;}
#log p{margin:4px 0;line-height:1.5;}
#choices{display:flex;flex-direction:column;gap:8px;}
button.choice{background:var(--panel2);border:1px solid var(--border);color:var(--white);
  padding:10px 14px;text-align:left;border-radius:5px;font-family:inherit;font-size:14px;cursor:pointer;}
button.choice:hover{border-color:var(--orange);background:#22252d;}
button.choice.danger{border-color:var(--red);}
button.choice.good{border-color:var(--green);}
.inputrow{display:flex;gap:8px;margin-top:6px;}
.inputrow input{flex:1;background:#0a0b0d;border:1px solid var(--border);color:var(--white);padding:8px;border-radius:5px;font-family:inherit;}
.inputrow button{background:var(--orange);border:none;color:#20130a;padding:8px 16px;border-radius:5px;font-weight:bold;cursor:pointer;}
.red{color:var(--red);} .orange{color:var(--orange);} .yellow{color:var(--yellow);}
.yellowpale{color:var(--yellowpale);} .green{color:var(--green);} .green2{color:var(--green2);}
.blue{color:var(--blue);} .purple{color:var(--purple);} .pink{color:var(--pink);}
.cyan{color:var(--cyan);} .gray{color:var(--gray);} .darkgray{color:var(--darkgray);}
.white{color:var(--white);} .brown{color:var(--brown);} .brownlight{color:var(--brownlight);}
h3.section{color:var(--red);border-bottom:1px solid var(--border);padding-bottom:4px;margin-top:0;}
table.grid{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;}
table.grid td{border:1px solid var(--border);padding:5px;text-align:center;color:var(--cyan);}
.footer{text-align:center;color:var(--darkgray);font-size:11px;padding:10px;}
::selection{background:var(--orange);color:#000;}
</style>
</head>
<body>
<div id="statbar"></div>
<div id="title">⚔ AUX CONFINS D'ATHANOR ⚔</div>
<div id="main">
  <div id="ascii"></div>
  <div id="log"></div>
  <div id="choices"></div>
</div>

}

/* ============================== INVENTAIRE ============================== */

function addItem(nom, type, qte){
  if(type==="Arme"||type==="Armure"){
    for(let i=0;i<30;i++) if(!INV.slots[i]){ INV.slots[i]={nom,type,qte:1}; return true; }
    return false;
  }
  const maxStack=30;
  for(let i=0;i<30 && qte>0;i++){
    const s=INV.slots[i];
    if(s && s.nom===nom && s.qte<maxStack){
      const libre=maxStack-s.qte;
      if(qte<=libre){ s.qte+=qte; qte=0; break; }
      s.qte=maxStack; qte-=libre;
    }
  }
  for(let i=0;i<30 && qte>0;i++){
    if(!INV.slots[i]){ const a=Math.min(qte,maxStack); INV.slots[i]={nom,type,qte:a}; qte-=a; }
  }
  return qte<=0;
}
function countItem(nom){ return INV.slots.reduce((s,x)=>x&&x.nom===nom?s+x.qte:s,0); }
function removeItem(nom, qte){
  if(countItem(nom)<qte) return false;
  let reste=qte;
  for(let i=0;i<30 && reste>0;i++){
    const s=INV.slots[i];
    if(s && s.nom===nom){
      if(s.qte<=reste){ reste-=s.qte; INV.slots[i]=null; } else { s.qte-=reste; reste=0; }
    }
  }
  return true;
}
function equipSlot(i){
  const it=INV.slots[i];
  if(!it) return "Ce slot est vide.";
  if(it.type!=="Arme" && it.type!=="Armure") return it.nom+" n'est pas un équipement.";
  if(it.type==="Arme"){ const old=INV.equip.arme; INV.equip.arme=it; INV.slots[i]=old; return "Vous avez équipé l'arme : "+it.nom; }
  const old=INV.equip.armure; INV.equip.armure=it; INV.slots[i]=old; return "Vous avez équipé l'armure : "+it.nom;
}

/* ============================== NIVEAU ============================== */

function expRequise(level){ return 10+80*(level-1); }
function gainExp(exp){
  P.exp+=exp;
  let req=expRequise(P.level);
  let ups=[];
  while(P.exp>=req){
    P.level++; P.exp-=req;
    if(P.level<=10){ P.atk+=3; P.health+=15; } else if(P.level<=25){ P.atk+=7; P.health+=30; } else { P.atk+=30; P.health+=100; }
    req=expRequise(P.level);
    if(P.level<=10) P.title="Débutant"; else if(P.level<=20) P.title="Novice"; else if(P.level<=30) P.title="Vétéran";
    else if(P.level<=40) P.title="Pro"; else if(P.level<=50) P.title="Master Pro"; else P.title="Master Pro ++";
    ups.push(P.level);
  }
  return ups;
}

  const armorBonus = INV.equip.armure ? (PVARMURE[INV.equip.armure.nom]||0) : 0;
  fightState = {
    mobKey, retourLieu, isBoss,
    mHealth: m0.health, mHealthMax: m0.health,
    mAtkFull: m0.atk, mAtk: isBoss ? Math.floor(m0.atk/2) : m0.atk, halfReached:false,
    jHealth: P.health + armorBonus, jHealthMax: P.health + armorBonus,
    endu: P.endurance, forcePotion:false,
  };
  renderFight();
}

function classAttaques(){ return ATTAQUES_CLASSE[P.class] || ATTAQUES_CLASSE["Aventurier"]; }

function renderFight(){
  const fs=fightState, m=getMob(fs.mobKey,P.level);
  clearLog(); setAscii("⚔  C O M B A T  ⚔");
  line(`<span class="red">--------------- ${esc(P.name)} VS ${esc(m.name)} ---------------</span>`);
  line(`<span class="orange">Santé de ${esc(P.name)} : ${Math.max(0,fs.jHealth)} HP</span>`);
  line(`<span class="yellow">Santé de ${esc(m.name)} : ${Math.max(0,fs.mHealth)} HP</span>`);
  line(`<span class="blue">Endurance de ${esc(P.name)} : ${fs.endu}</span>`);
  const table=attaqueTable();
  const attaques=classAttaques();
  renderStatbar();
  const choices=attaques.map((nom,idx)=>{
    const a=table[nom];
    return [`${idx+1} - Utiliser ${esc(nom)} (${a.deg} DGT, ${a.cout} Endu)`, ()=>doAttaque(idx)];
  });
  choices.push(["4 - Utiliser une potion", showFightPotions]);
  setChoices(choices);
}

function doAttaque(idx){
  const fs=fightState, attaques=classAttaques(), nom=attaques[idx], table=attaqueTable();
  const m=getMob(fs.mobKey,P.level);
  let msgs=[];
  if(fs.endu < table[nom].cout){
    const punch=table["Coup de poing"].deg;
    fs.mHealth-=punch;
    msgs.push('<span class="blue">Vous n\'avez plus assez d\'endurance pour lancer cette attaque !</span>');
    msgs.push(`<span class="brownlight">Vous lancez Coup de poing et infligez ${punch} DGT</span>`);
  } else {
    let atk=table[nom].deg;
    let crit=false;
    if(Math.random()*100<10){ atk*=2; crit=true; }
    if(fs.forcePotion){ atk*=2; fs.forcePotion=false; msgs.push('<span class="green2">POTION DE FORCE ! Dégâts doublés !</span>'); }
    fs.mHealth-=atk;
    if(crit) msgs.push('💥 <b>COUP CRITIQUE !</b>');
    msgs.push(`<span class="red">${esc(P.name)} attaque : ${atk} DGT</span>`);
    fs.endu-=table[nom].cout;
  }
  applyMobTurnAndContinue(msgs);
}

function applyMobTurnAndContinue(msgs){
  const fs=fightState, m=getMob(fs.mobKey,P.level);
  if(fs.isBoss && !fs.halfReached && fs.mHealth<=fs.mHealthMax/2){
    fs.halfReached=true; fs.mAtk=fs.mAtkFull;
    msgs.push(`<span class="red">[!] ${esc(m.name)} a perdu la moitié de ses PV ! Il retrouve toute sa puissance !</span>`);
  }
  if(fs.mHealth>0){
    msgs.push(`<span class="orange">${esc(m.name)} lance ${esc(m.atkname)} et vous infligez ${fs.mAtk} DGT</span>`);
    fs.jHealth-=fs.mAtk;
  }
  clearLog(); setAscii("⚔  C O M B A T  ⚔");
  msgs.forEach(x=>line(x));
  renderStatbar();
  if(fs.jHealth<=0 || fs.mHealth<=0){
    setChoices([["Continuer...", resolveFight]]);
  } else {
    setChoices([["Continuer le combat...", renderFight]]);
  }
}

function showFightPotions(){
  const fs=fightState;
  clearLog(); setAscii("⚔  C O M B A T  ⚔");
  line('<span class="green2">1 - Utiliser potion de soin</span>');
  line('<span class="green2">2 - Utiliser potion de dégât</span>');
  line('<span class="green2">3 - Utiliser potion de force</span>');
  line('<span class="cyan">4 - Retour</span>');
  line(`<span class="gray">Potions possédées — Soin: ${countItem("Potion de Soin")}, Dégât: ${countItem("Potion de Dégat")}, Force: ${countItem("Potion de Force")}</span>`);
  renderStatbar();
  setChoices([
    ["1 - Potion de soin", ()=>useFightPotion("Potion de Soin")],
    ["2 - Potion de dégât", ()=>useFightPotion("Potion de Dégat")],
    ["3 - Potion de force", ()=>useFightPotion("Potion de Force")],
    ["4 - Retour", renderFight],
  ]);
}

function useFightPotion(nom){
  const fs=fightState, m=getMob(fs.mobKey,P.level);
  let msgs=[];
  if(nom==="Potion de Soin"){
    if(removeItem(nom,1)){
      const heal=Math.floor(fs.jHealthMax/2);
      fs.jHealth+=heal;
      msgs.push(`<span class="green2">Potion de Soin utilisée, vous récupérez ${heal} PV !</span>`);
    } else msgs.push('<span class="red">Vous n\'avez pas de Potion de Soin !</span>');
  } else if(nom==="Potion de Dégat"){
    if(removeItem(nom,1)){
      const dgt=P.atk*2; fs.mHealth-=dgt;
      msgs.push(`<span class="green2">Potion de Dégat utilisée, vous infligez ${dgt} DGT !</span>`);
    } else msgs.push('<span class="red">Vous n\'avez pas de Potion de Dégat !</span>');
  } else if(nom==="Potion de Force"){
    if(removeItem(nom,1)){
      fs.forcePotion=true;
      msgs.push('<span class="green2">Potion de Force utilisée, votre prochaine attaque sera doublée !</span>');
    } else msgs.push('<span class="red">Vous n\'avez aucune Potion de Force !</span>');
  }
  applyMobTurnAndContinue(msgs);
}

function resolveFight(){
  const fs=fightState, m=getMob(fs.mobKey,P.level);
  clearLog(); setAscii("");
  if(fs.jHealth<=0 && fs.mHealth<=0){ fightWin(); }
  else if(fs.jHealth<=0){ fightLose(); return; }
  else { fightWin(); }
}

function fightWin(){
  const fs=fightState, m=getMob(fs.mobKey,P.level);
  line(`<span class="green">Bravo ! Vous avez vaincu ${esc(m.name)} !</span>`);
  const ups=gainExp(m.exp);
  line(`<span class="green">+${m.exp} points d'expérience</span>`);
  ups.forEach(lvl=>line(`<span class="green2">Niveau supérieur ! Vous êtes maintenant niveau ${lvl} ! Vous êtes un ${esc(P.title)} !</span>`));
  if(addItem(m.loot,"Ressource",1)) line(`<span class="cyan">[+] ${esc(m.loot)} ajouté à l'inventaire !</span>`);
  renderStatbar();
  setChoices([["Retourner là où vous étiez", ()=> fs.isBoss ? screenVillage() : screenLieu(fs.retourLieu)]]);
}

function fightLose(){
  clearLog(); setAscii("💀");
  line('<span class="red">Vous avez été vaincu...</span>');
  P.level -= 1;
  if(P.level < 0){ return screenGameOver("Votre aventure s'achève ici..."); }
  line('<span class="red">Vous perdez 1 niveau.</span>');
  line(`<span class="red">Vous êtes maintenant niveau ${P.level}.</span>`);
  renderStatbar();
  setChoices([["Retourner au village", screenVillage]]);
}

  clearLog(); setAscii("W A S T E D");

function askQty(mode, nom, prix, isBuy){

    const ing=r.ing.map(([n,q])=>`${esc(n)} x${q} (vous: ${countItem(n)})`).join(", ");
    line(`<b>[${i+1}] ${esc(r.nom)}</b> (${esc(r.cat)}) — ${ing}`);

function doCraft(i){
  const r=RECETTES[i];
  clearLog();
  let peut=true;
  for(const [n,q] of r.ing){ if(countItem(n)<q){ peut=false; line(`<span class="red">❌ Il vous manque des ressources ! ${countItem(n)}/${q} ${esc(n)}.</span>`); break; } }
  if(peut){
    r.ing.forEach(([n,q])=>removeItem(n,q));
    addItem(r.nom, r.cat==="Armure"?"Armure":"Arme", 1);
    line(`<span class="green">🎉 Succès ! Vous avez forgé : ${esc(r.nom)} !</span>`);
  }
  renderStatbar();
  setChoices([["Retour aux recettes", screenCraft]]);
}

function playPotionSequence(){

    "Vous vous rendez compte de quelque chose...",
    "Cette potion n'était pas ce que vous pensiez...",
  ];
  let i=0;
  function step(){
    clearLog(); setAscii("🧪");
    line('<span class="purple">'+esc(seq[i])+'</span>');
    i++;
    if(i<seq.length){ setChoices([["Continuer", step]]); }

      P.health -= 1;
      if(P.health<=0){
        clearLog(); setAscii("💀");
        line('<span class="red">Cette gorgée de potion vous aura été fatale...</span>');

        renderStatbar();
        setChoices([["Retour à l'auberge", screenAuberge]]);

    }
  }
  step();
}

  "Le Château":"Le Chevalier, la Gargouille, et l'effrayant Tableau de la Joconde, dont l'attaque est redoutable.",
};

function screenBiblio(){
  clearLog(); setAscii("📚");
  line('<span class="red">--------------- Bibliothèque ---------------</span>');
  renderStatbar();
  setChoices([
    ["Volume 1 : Les lieux et les monstres", screenVol1],
    ["Volume 2 : Les armes et armures", ()=>screenVolume("Volume 2 : Les armes et armures", VOL2)],
    ["Volume 3 : La forge et le shop", ()=>screenVolume("Volume 3 : La forge et le shop", VOL3)],
    ["Volume 4 : Les classes et les races", ()=>screenVolume("Volume 4 : Les classes et les races", VOL4)],
    ["Volume 5 : La sorcière", ()=>screenVolume("Volume 5 : La sorcière", VOL5)],
    ["Volume 6 : La tragédie de Valenkor", ()=>screenVolume("Volume 6 : La tragédie de Valenkor", VOL6)],
    ["Retour au village", screenVillage],
    ["🗺 Voir la carte", ()=>screenMap(screenBiblio)],
  ]);
}
function screenVolume(titre, texte){
  clearLog(); setAscii("");
  line(`<span class="red">--------------- ${esc(titre)} ---------------</span>`);
  line('<span class="gray">'+esc(texte).replace(/\n/g,'<br>')+'</span>');
  setChoices([["Revenir à la bibliothèque", screenBiblio]]);
}
function screenVol1(){
  clearLog(); setAscii("");
  line('<span class="red">--------------- Tome 1 : les chapitres ---------------</span>');
  renderStatbar();
  const choices=Object.entries(VOL1_CHAPS).map(([titre,texte])=>[titre, ()=>{
    clearLog(); line(`<span class="red">--------------- ${esc(titre)} ---------------</span>`);
    line('<span class="gray">'+esc(texte)+'</span>');
    setChoices([["Retour aux chapitres", screenVol1]]);
  }]);
  choices.push(["Retour à la bibliothèque", screenBiblio]);
  setChoices(choices);
}

/* ============================== LANCEMENT ============================== */

screenCreate();
</script>
